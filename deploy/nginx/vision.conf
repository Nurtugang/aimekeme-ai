# Дашборд оператора: собранный фронтенд (vision/platform/frontend/dist) + backend
# платформы на :8013. Фронтенд ходит на /api и /ws того же адреса, поэтому
# всё за одним портом: http://<сервер>/
#   npm run build -> /opt/vision/platform/frontend/dist
# Живое видео (go2rtc) браузер берёт напрямую с :1984, мимо этого конфига.

server {
    listen 80;

    root /opt/vision/platform/frontend/dist;
    index index.html;

    client_max_body_size 64m;          # фото людей при добавлении в базу лиц

    location / {
        try_files $uri $uri/ /index.html;   # маршруты SPA (React Router)
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # MJPEG-превью камер — бесконечный ответ: без буфера и без таймаута
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
