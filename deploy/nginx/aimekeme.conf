# AI-API за nginx: платформа знает один адрес (AI_API_URL=http://127.0.0.1:8000),
# раскладка по процессам и картам — здесь (docs/SCALING_TZ.md §5.1-5.2).
#   GPU0 (ai-g0  :8100, ai-g0b :8103) — fight, fire; резерв для остального;
#        ai-g0 — единственный, кто пишет базу лиц
#   GPU1 (ai-g1a :8101, ai-g1b :8102) — face, counting/heatmap, persons; резерв для GPU0
# counting/heatmap — на GPU1: на 23 реальных камерах GPU0 с ними был занят
# 30-35% (пики 64%), а GPU1 — 8-18%. Замер одной камерой (§3) обманул.
#
# На другой процесс запрос уходит только при ОТКАЗЕ процесса (не подключился,
# 502/503), а не по таймауту: медленный ответ решает таймаут платформы
# (FIGHT/MODULE/SLOW_AI_TIMEOUT_S). С max_fails=1 nginx по таймауту выключал
# бы исправный, просто занятой процесс на fail_timeout.
# /stats через nginx показывает случайный процесс — смотрите порты процессов.

upstream ai_alarm {
    least_conn;
    server 127.0.0.1:8100 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8103 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8101 backup;
    server 127.0.0.1:8102 backup;
    keepalive 32;
}

upstream ai_main {
    least_conn;
    server 127.0.0.1:8101 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8102 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8100 backup;
    server 127.0.0.1:8103 backup;
    keepalive 64;
}

# Запись базы лиц — только один процесс: имена файлов фото назначает он сам,
# два писателя разом перезаписали бы фото друг друга. Остальные процессы
# подхватывают изменения сами (версия галереи, ~1 с). Резерва нет намеренно:
# пока ai-g0 перезапускается (до 30 с), добавить лицо нельзя — ошибка в UI
# лучше испорченной базы.
upstream ai_writer {
    server 127.0.0.1:8100;
}

map $request_method $ai_faces_upstream {
    GET     ai_main;
    HEAD    ai_main;
    default ai_writer;
}

server {
    listen 127.0.0.1:8000;

    client_max_body_size 64m;          # enroll: N фото до 5 МБ каждое

    proxy_http_version 1.1;
    proxy_set_header Connection "";    # keepalive к процессам
    proxy_connect_timeout 1s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;            # дольше любого таймаута платформы — решает она

    location ~ ^/detect/(fight|fire)$ {
        proxy_pass http://ai_alarm;
        # /detect/* ничего не меняют — повтор на резерве безопасен
        proxy_next_upstream error http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }

    location /detect/ {
        proxy_pass http://ai_main;
        proxy_next_upstream error http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }

    location /faces {
        proxy_pass http://$ai_faces_upstream;
        proxy_next_upstream off;       # повтор записи = двойной enroll
        proxy_read_timeout 120s;       # enroll нескольких фото
    }

    location / {                       # /health, /docs, /openapi.json
        proxy_pass http://ai_main;
    }
}
