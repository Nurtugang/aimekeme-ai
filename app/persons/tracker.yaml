# BoT-SORT под аудиторию: статичная камера сверху, люди подолгу сидят
# склонившись -- детекция пропадает и возвращается на то же место.

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
# склонившийся пропадает из детекции на 3-5 с — держим трек, чтобы id не сменился;
# счётчик проанализированных кадров, не секунд
track_buffer: 90
match_thresh: 0.8
fuse_score: true
# камера неподвижна — компенсация её движения не нужна
gmc_method: none

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
