# BoT-SORT под аудиторию: статичная камера сверху, тесная рассадка, люди
# подолгу сидят склонившись (пишут в тетради) -- детекция/скелет на таких
# кадрах то пропадает, то возвращается на то же самое место. Отличия от
# дефолтного ultralytics/cfg/trackers/botsort.yaml см. в комментариях ниже.
# Смотрите app/persons/model.py (_TRACKER_CFG) -- используется вместо
# встроенного "botsort.yaml".

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25

# Было 30 (~1-2 c при 15-30 fps). Склонившийся студент может не давать
# уверенной детекции по 3-5+ секунд подряд (голова закрывает торс, поза
# уводит скелет ниже порога) -- трекер отбрасывал след и на возврате заводил
# новый track_id. Держим кандидата дольше; конкретное значение зависит от
# fps/stride видео (это счётчик ПРОАНАЛИЗИРОВАННЫХ кадров, не секунд) --
# 90 расчитано на типичный конвейер уровня 15-30 исходных fps со stride 2.
track_buffer: 90

# Было 0.8. Поза сидя-склонившись резко меняет форму бокса кадр к кадру
# (то в основном спина, то в основном затылок) -- строгий IoU-порог рвал
# матчинг того же человека на две разных дорожки. Отпущено, чтобы такие
# скачки формы бокса не создавали лишний ID; насколько это повышает риск
# перепутать двух РЯДОМ сидящих людей на конкретной съёмке -- проверяйте по
# "По скелету"/"Стабильность" в scripts/persons_web.py, при необходимости
# верните ближе к 0.8.
match_thresh: 0.72
fuse_score: true

# Было sparseOptFlow (компенсация движения КАМЕРЫ). Камера в аудитории
# статична -- эта компенсация только вносит шум в предсказанное положение
# трека (оптический поток путает движение рук/ручек на столе с движением
# сцены). Для неподвижной камеры компенсация не нужна вовсе.
gmc_method: none

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
